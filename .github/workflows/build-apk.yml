
name: Build THE SYSTEM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Find Android project
        id: project
        run: |
          WRAPPER=$(find project -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-SYSTEM-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
